name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/analyse.py --output /tmp/accessmap-clinic.csv
  qgis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-qgis
      - run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 scripts/verify_qgis.py
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: mobile
      - run: npm test
        working-directory: mobile
      - run: EXPO_OFFLINE=1 npx expo install --check
        working-directory: mobile
      - run: EXPO_OFFLINE=1 npx expo export --platform web
        working-directory: mobile
